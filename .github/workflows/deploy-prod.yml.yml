name: Deploy — Production (EKS)

on:
  push:
    branches: [main]

jobs:
  deploy-prod:
    name: Deploy to EKS Production
    runs-on: ubuntu-latest
    environment: production   # Requires manual approval in GitHub Environments UI
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-eks-deploy
          aws-region: us-east-1

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name cloudops-cluster --region us-east-1

      - name: Install Helm
        uses: azure/setup-helm@v3
        with:
          version: "3.14.0"

      - name: Blue/Green deploy with Helm
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          helm upgrade --install cloudops-agent ./helm/agent \
            --namespace cloudops-prod \
            --create-namespace \
            --set image.tag=$IMAGE_TAG \
            --set environment=production \
            --set replicaCount=3 \
            --values helm/values.prod.yaml \
            --wait --timeout=10m \
            --atomic   # Auto-rollback if rollout fails

      - name: Verify deployment health
        run: |
          kubectl rollout status deployment/cloudops-agent \
            -n cloudops-prod --timeout=5m

      - name: Notify Slack — success
        if: success()
        uses: slackapi/slack-github-action@v1
        with:
          payload: '{"text":"✅ Production deploy succeeded: ${{ github.sha }}"}'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Notify Slack — failure + rollback notice
        if: failure()
        uses: slackapi/slack-github-action@v1
        with:
          payload: '{"text":"🚨 Production deploy FAILED and was rolled back: ${{ github.sha }}"}'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
